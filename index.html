<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#87CEEB">
  <title>珊珊的生活基地</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="珊珊基地">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=7">
  <style>
    /* 强制覆盖：美乐蒂头像大小 */
    .mascot{width:80px!important;height:80px!important}
    /* 强制覆盖：sad状态灰色 */
    .mascot.sad{opacity:.6!important}
    .mascot.sad .mascot-svg{filter:grayscale(.8) brightness(.8)!important;-webkit-filter:grayscale(.8) brightness(.8)!important}
    /* 强制覆盖：happy状态 */
    .mascot.happy .mascot-svg{animation:wiggle 2s ease-in-out infinite}
    @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
    /* 强制覆盖：super状态 */
    .mascot.super .mascot-svg{animation:bounce .4s ease infinite alternate}
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
  </style>
</head>
<body>
<div class="app">
  <!-- 顶部：美乐蒂头+状态 -->
  <header class="top-header">
    <div class="mascot">
      <svg viewBox="0 0 100 100" class="mascot-svg" id="mascotSvg">
        <defs>
          <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#7EC8E3"/>
            <stop offset="100%" stop-color="#4F86C6"/>
          </linearGradient>
        </defs>
        <!-- 耳朵内层粉色 -->
        <ellipse cx="28" cy="28" rx="7" ry="10" fill="#FFB6C1"/>
        <ellipse cx="72" cy="28" rx="7" ry="10" fill="#FFB6C1"/>
        <!-- 耳朵外层蓝 -->
        <ellipse cx="28" cy="22" rx="11" ry="15" fill="url(#hoodGrad)" id="earL"/>
        <ellipse cx="72" cy="22" rx="11" ry="15" fill="url(#hoodGrad)" id="earR"/>
        <!-- 蓝色帽兜 -->
        <circle cx="50" cy="46" r="32" fill="url(#hoodGrad)" id="hood"/>
        <!-- 脸部白色 -->
        <ellipse cx="50" cy="52" rx="25" ry="22" fill="#fff" id="face"/>
        <!-- 眼睛 -->
        <circle cx="38" cy="44" r="4" fill="#333" id="eyeL"/>
        <circle cx="62" cy="44" r="4" fill="#333" id="eyeR"/>
        <circle cx="39" cy="42" r="1.5" fill="#fff"/>
        <circle cx="63" cy="42" r="1.5" fill="#fff"/>
        <!-- 鼻子 -->
        <ellipse cx="50" cy="52" rx="3" ry="2" fill="#FF9EC4"/>
        <!-- 嘴巴 -->
        <path d="M42 58 Q50 67 58 58" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" id="mouth"/>
        <!-- 腮红 -->
        <circle cx="32" cy="55" r="5" fill="#FFB6C1" opacity="0.6"/>
        <circle cx="68" cy="55" r="5" fill="#FFB6C1" opacity="0.6"/>
        <!-- 头饰蝴蝶结 -->
        <g id="bow">
          <circle cx="22" cy="18" r="3" fill="#FF9EC4"/>
          <circle cx="78" cy="18" r="3" fill="#FF9EC4"/>
        </g>
      </svg>
    </div>
    <div class="mascot-info">
      <div class="mascot-name">美乐蒂 🐶</div>
      <div class="mascot-status" id="mascotStatus">美乐蒂在等你～</div>
    </div>
    <div class="header-right">
      <div class="streak-box">
        <div class="streak-num" id="streakNum">0</div>
        <div class="streak-label">连续天数</div>
      </div>
    </div>
  </header>

  <!-- 进度条 -->
  <div class="progress-wrap">
    <div class="progress-info">
      <span>今日任务完成度</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- 主内容区：左侧栏 + 右侧内容 -->
  <div class="main-container">
    <!-- 左侧导航 -->
    <nav class="sidebar" id="sidebar">
      <div class="side-cat-label">📚 学习</div>
      <div class="side-item active" data-cat="chinese">
        <div class="side-icon" style="background:linear-gradient(135deg,#FFB6C1,#FF85A2)">📖</div>
        <div class="side-name">语文</div>
        <div class="side-count" id="cntChinese">0/0</div>
      </div>
      <div class="side-item" data-cat="math">
        <div class="side-icon" style="background:linear-gradient(135deg,#A6CCFF,#5B9BD5)">🔢</div>
        <div class="side-name">数学</div>
        <div class="side-count" id="cntMath">0/0</div>
      </div>
      <div class="side-item" data-cat="english">
        <div class="side-icon" style="background:linear-gradient(135deg,#FFD93D,#FFA552)">🌍</div>
        <div class="side-name">英语</div>
        <div class="side-count" id="cntEnglish">0/0</div>
      </div>

      <div class="side-cat-label">🌱 生活</div>
      <div class="side-item" data-cat="life">
        <div class="side-icon" style="background:linear-gradient(135deg,#A6E3A1,#7AC74F)">🏠</div>
        <div class="side-name">习惯</div>
        <div class="side-count" id="cntLife">0/0</div>
      </div>

      <div class="side-cat-label">🏃 运动</div>
      <div class="side-item" data-cat="sport">
        <div class="side-icon" style="background:linear-gradient(135deg,#FFA1B5,#FF6B9D)">🏃</div>
        <div class="side-name">锻炼</div>
        <div class="side-count" id="cntSport">0/0</div>
      </div>

      <div class="side-cat-label">🎮 小游戏</div>
      <div class="side-item" data-cat="game">
        <div class="side-icon" style="background:linear-gradient(135deg,#B19CD9,#9B7ED4)">🎮</div>
        <div class="side-name">游戏</div>
        <div class="side-count" id="cntGame">0/15</div>
      </div>
    </nav>

    <!-- 右侧主区 -->
    <div class="right-area">
      <!-- 顶部子类目横排 -->
      <div class="subcat-bar" id="subcatBar"></div>
      <!-- 内容区 -->
      <div class="content-area" id="contentArea"></div>
    </div>
  </div>

  <!-- 美乐蒂互动按钮（达标后显示） -->
  <div class="melody-actions" id="melodyActions" style="display:none">
    <button class="melody-btn feed" onclick="openFeed()">🍖 喂食</button>
    <button class="melody-btn bath" onclick="openBath()">🛀 洗澡</button>
  </div>

  <!-- 喂食弹窗 -->
  <div class="modal" id="feedModal">
    <div class="modal-content">
      <h3>🍖 给美乐蒂喂食</h3>
      <div class="food-grid" id="foodGrid"></div>
      <button class="modal-close" onclick="closeModal('feedModal')">关闭</button>
    </div>
  </div>

  <!-- 洗澡弹窗 -->
  <div class="modal" id="bathModal">
    <div class="modal-content">
      <h3>🛀 给美乐蒂洗澡</h3>
      <div class="bath-steps" id="bathSteps"></div>
      <button class="modal-close" onclick="closeModal('bathModal')">关闭</button>
    </div>
  </div>

  <!-- 鼓励弹窗 -->
  <div class="modal" id="praiseModal">
    <div class="modal-content praise">
      <div class="praise-emoji" id="praiseEmoji">🎉</div>
      <p id="praiseText"></p>
      <button class="modal-close" onclick="closeModal('praiseModal')">好的</button>
    </div>
  </div>
</div>

<script src="app.js?v=7"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}</script>
</body>
</html>
